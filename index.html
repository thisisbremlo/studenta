<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Benjamin Michael Bremer" />
    <link rel="canonical" href="https://studenta.bremlo.uk/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta name="theme-color" content="#09090b" />

    <!-- Structured data -->

      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "studenta.bremlo.uk",
      "alternateName": "studenta",
      "url": "https://studenta.bremlo.uk/",
      "description": "Curated directory of free and discounted student benefits: software, streaming, banking, mobility, fitness and more.",
      "inLanguage": ["en", "de"],
      "image": "https://studenta.bremlo.uk/logo.svg",
      "author": {
        "@type": "Person",
        "name": "Benjamin Michael Bremer",
        "url": "https://bremlo.uk"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://studenta.bremlo.uk/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "studenta.bremlo.uk",

      "logo": "https://studenta.bremlo.uk/logo.svg",

        "@type": "Person",
        "name": "Benjamin Michael Bremer",
        "url": "https://bremlo.uk"

        "@type": "PostalAddress",

        "addressCountry": "DE"
      }
    }

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply theme before first paint (default: dark)
      document.documentElement.classList.toggle("dark", localStorage.getItem("theme") !== "light");
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
